<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de monitoramento</title>
    <style>
        body {
            font-family: Montserrat, sans-serif;
            text-align: left;
            padding: 20px;
            background-color: #121212; /* Fundo escuro */
            color: #ffffff;
            margin: 0;
        }

        /* Barra superior e Busca parecida com image_27d575.png */
        .barra-superior {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .container-busca {
            background-color: #2c2c2c;
            border-radius: 25px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }

        .input-busca {
            background: transparent;
            border: none;
            color: #8c8c8c;
            font-size: 16px;
            outline: none;
            width: 200px;
        }
        
        .input-busca::placeholder {
            color: #8c8c8c;
        }

        .icone-busca {
            color: #ffffff;
            font-size: 18px;
            margin-left: 10px;
            cursor: pointer;
        }

        /* Título Principal */
        .cabecalho {
            text-align: center;
            margin-bottom: 40px;
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 36px;
        }

        /* Grid de Locais (Home) */
        .grid-locais {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .painel-local {
            background-color: #ff8c00; /* Laranja */
            color: #ffffff; /* Letras brancas */
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            width: 200px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .painel-local:hover {
            transform: scale(1.05);
        }

    </style>
</head>

<body>

    <div class="barra-superior">
        <div class="container-busca">
            <input type="text" class="input-busca" placeholder="BUSCAR">
            <span class="icone-busca">🔍</span>
        </div>
    </div>

    <div class="cabecalho">
        <h1>SISTEMA DE MONITORAMENTO</h1>
    </div>

    <div class="grid-locais">
        <a href="hospital.html" class="painel-local">Hospital Universitário</a>
        <a href="#" class="painel-local">Local 2</a>
        <a href="#" class="painel-local">Local 3</a>
        <a href="#" class="painel-local">Local 4</a>
        <a href="#" class="painel-local">Local 5</a>
        <a href="#" class="painel-local">Local 6</a>
        <a href="#" class="painel-local">Local 7</a>
        <a href="#" class="painel-local">Local 8</a>
        <a href="#" class="painel-local">Local 9</a>
        <a href="#" class="painel-local">Local 10</a>
    </div>

</body>
</html>
